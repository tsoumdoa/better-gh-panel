description: >
  Panel+ beta is a fast, resizable Grasshopper data panel for Rhino 8.
  Trim, simplify, flatten, reverse, or create sets of unique displayed values directly on the
  canvas. Search, filter, sort values within each branch, jump to branches and rows, and inspect
  item and branch counts, numeric statistics, and unique values with frequencies.
  Create set runs after filters, units and decimal formatting, and outputs displayed numbers or text.
  Displayed list lengths form one set of counts across branches, including zero for empty branches.
  Set rows show occurrence badges and expandable original input locations.
  One header chevron toggles full and half views; the close button minimizes
  the panel to a small capsule while preserving its view and wire connections. A compact
  footer menu converts length, area, volume, and angle units and sets decimal formatting.
  Visible geometry rows show cached metrics calculated lazily in the background; invalid values have clear labels.
  Preview selected geometry by default, all filtered results, or none.
  Optionally show item-order labels at points and geometry centers in the viewport.
  Select rows or branches without moving the camera; use Frame selection to zoom explicitly.
  Select matching item indices across filtered branches from the row menu or with Alt/Option-click.
  Filter values, geometry length, area, volume, or per-branch list length with comparisons.
  Choose Display value beside the operators to inspect numeric values, measurements,
  or one list-length count per branch, including empty branches, without a comparison.
  Branch paths accept optional braces. Text and regular expressions match displayed units and decimals.
  Filters apply to typed output after tree tools and unit conversion.
  D emits filter matches or displayed set values; S emits selected values. B supplies an original-input Boolean mask,
  and the optional F input/output filters paired data in sync with D or S.
  B and F follow Filtered results by default, with a Selected rows option in the component menu.
  Pending results show a recomputing state instead of stale rows and statistics.
  Copy converted numeric values from selected rows.
  Native geometry copying for Rhino Paste supports Windows with standard model units.
  Includes Windows and Mac builds; Mac runtime validation is pending.
url: https://github.com/tsoumdoa/better-gh-panel
