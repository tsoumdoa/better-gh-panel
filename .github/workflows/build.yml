name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            7.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core behavior and performance checks
        run: dotnet run --project tests/BetterGhPanel.Core.Tests -c Release
      - name: Packaging regression checks
        run: node --test tests/package.test.mjs
      - name: Build both Rhino runtimes and stage plugin
        run: node scripts/package.mjs --stage-only
      - uses: actions/upload-artifact@v4
        with:
          name: better-gh-panel-${{ matrix.os }}
          path: artifacts/better-gh-panel-*/
          if-no-files-found: error
